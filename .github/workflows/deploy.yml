name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # 需要在仓库 Settings → Secrets and variables → Actions → Variables 中设置 DEPLOY_ENABLED=true 才会部署；
    # 未设置时直接跳过（fork 或按钮复制出的仓库不会因为缺少 secret 而报错）。
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # 生产配置里的 D1 database_id 是占位符，部署时用仓库 secret 替换（开源仓库不写死任何人的数据库）
      - run: sed -i "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/" wrangler.production.jsonc
        working-directory: apps/server
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy --config wrangler.production.jsonc
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
